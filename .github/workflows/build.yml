name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

# cancel superseded runs on the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        # bash on Windows too, so ./mvnw works on both runners
        shell: bash
        run: ./mvnw --batch-mode verify

  # single check named "build" for branch protection, independent of the matrix;
  # always() so that a failed matrix job fails this one instead of skipping it,
  # since a skipped required check would count as passed
  build:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: test "${{ needs.verify.result }}" = success
